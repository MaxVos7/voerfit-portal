# Cloud Build configuration for the voerfit-portal image.
# Build with: gcloud builds submit --config=cloudbuild.yaml --substitutions=_TAG=<tag> .

substitutions:
  _IMAGE: 'europe-west4-docker.pkg.dev/fabled-web-472815-h8/ml-training/voerfit-portal'
  _TAG: 'latest'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:${_TAG}'
      - '-t'
      - '${_IMAGE}:latest'
      - '.'
    timeout: 1800s

images:
  - '${_IMAGE}:${_TAG}'
  - '${_IMAGE}:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
