# voerfit-portal: the customer portal, served on vanvelde-new.voerfit.nl through
# the shared grafana-ingress (farmsolutionsai/server/08-grafana-ingress.yaml).
#
# Secrets live in the voerfit-portal Secret, created by hand (never committed):
#   APP_KEY, FARM_DB_USERNAME, FARM_DB_PASSWORD, PORTAL_USERNAME, PORTAL_PASSWORD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voerfit-portal
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels: { app: voerfit-portal }
  template:
    metadata:
      labels: { app: voerfit-portal }
    spec:
      containers:
      - name: portal
        image: europe-west4-docker.pkg.dev/fabled-web-472815-h8/ml-training/voerfit-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - { name: APP_NAME, value: "Voerfit" }
        - { name: APP_ENV, value: "production" }
        - { name: APP_DEBUG, value: "false" }
        - { name: APP_URL, value: "https://vanvelde-new.voerfit.nl" }
        - { name: APP_LOCALE, value: "nl" }
        - { name: LOG_CHANNEL, value: "stderr" }
        # No portal tables are needed yet: sessions live in cookies and nothing
        # is queued, so the default connection is a throwaway in-memory SQLite.
        - { name: DB_CONNECTION, value: "sqlite" }
        - { name: DB_DATABASE, value: ":memory:" }
        - { name: SESSION_DRIVER, value: "cookie" }
        - { name: SESSION_SECURE_COOKIE, value: "true" }
        - { name: CACHE_STORE, value: "file" }
        - { name: QUEUE_CONNECTION, value: "sync" }
        - { name: FARM_DB_HOST, value: "postgres" }
        - { name: FARM_DB_PORT, value: "5432" }
        - { name: FARM_DB_DATABASE, value: "ai" }
        envFrom:
        - secretRef:
            name: voerfit-portal
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          # The ai-stack-quota ResourceQuota requires a CPU limit on every container.
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /up
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /up
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: voerfit-portal
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: voerfit-portal
  ports:
    - port: 80
      targetPort: 8080
